---
- name: List Cohesity protection jobs
  hosts: localhost
  gather_facts: false

  vars:
    cohesity_api_url: "https://chzahcohclp01.balgroupit.com"
    cohesity_auth_domain: "balgroupit.com"
    cohesity_validate_certs: true
    cohesity_auth_endpoint: "/irisservices/api/v1/public/accessTokens"
    cohesity_jobs_endpoint: "/irisservices/api/v1/public/protectionJobs"

  tasks:
    - name: Obtain Cohesity access token
      ansible.builtin.uri:
        url: "{{ cohesity_api_url }}{{ cohesity_auth_endpoint }}"
        method: POST
        body_format: json
        body:
          username: "{{ lookup('env', 'COHESITY_USERNAME') }}"
          password: "{{ lookup('env', 'COHESITY_PASSWORD') }}"
          domain: "{{ cohesity_auth_domain }}"
        validate_certs: "{{ cohesity_validate_certs }}"
        return_content: true
        status_code: [200, 201]
      register: cohesity_auth_response
      no_log: true

    - name: Persist Cohesity access token
      ansible.builtin.set_fact:
        cohesity_access_token: "{{ cohesity_auth_response.json.accessToken | default(cohesity_auth_response.json.access_token) }}"
      no_log: true

    - name: List protection jobs
      ansible.builtin.uri:
        url: "{{ cohesity_api_url }}{{ cohesity_jobs_endpoint }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cohesity_access_token }}"
          Accept: "application/json"
        validate_certs: "{{ cohesity_validate_certs }}"
        return_content: true
        status_code: 200
      register: cohesity_jobs_response
      no_log: true

    - name: Display protection jobs
      ansible.builtin.debug:
        msg: "{{ cohesity_jobs_response.json }}"
